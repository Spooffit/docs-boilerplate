name: Docs generator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  generator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/DocsBoilerplate.Cli/DocsBoilerplate.Cli.csproj --configuration Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional documentation builder
        run: python -m pip install zensical==0.0.73
      - name: Smoke-test generation and site build
        run: bash tests/smoke.sh
