name: Docs generator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  generator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/DocsBoilerplate.Cli/DocsBoilerplate.Cli.csproj --configuration Release
      - name: Focused .NET contract tests
        run: dotnet run --configuration Release --project tests/DocsBoilerplate.ContractTests/DocsBoilerplate.ContractTests.csproj
      - name: Check smoke script syntax
        run: bash -n tests/smoke.sh
      - name: Smoke-test generation and Docsify shell
        run: bash tests/smoke.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate catalog and generated JSON Schema contracts
        run: |
          python -m pip install "jsonschema>=4.23,<5"
          python tests/schema_contracts.py
      - name: Check generated-content source hygiene
        run: python tests/catalog_hygiene.py
      - name: Protect historical migration inventory
        run: python tests/legacy_inventory.py
      - name: Check incoming links and historical deletion gates
        run: python tests/legacy_link_graph.py
      - name: Audit Q15 and Q20 historical evidence references
        run: python tests/source_evidence_links.py
      - name: Pack and install CLI as local .NET tool
        run: |
          dotnet pack src/DocsBoilerplate.Cli/DocsBoilerplate.Cli.csproj --configuration Release --output "$RUNNER_TEMP/packages"
          dotnet tool install --tool-path "$RUNNER_TEMP/docs-tool" --add-source "$RUNNER_TEMP/packages" DocsBoilerplate.Cli --version 0.1.0
          "$RUNNER_TEMP/docs-tool/docs-boilerplate" doctor
          "$RUNNER_TEMP/docs-tool/docs-boilerplate" init --name ToolDemo --description "Tool installation smoke test" --output "$RUNNER_TEMP/tool-demo" --profiles dotnet --non-interactive
          "$RUNNER_TEMP/docs-tool/docs-boilerplate" validate --output "$RUNNER_TEMP/tool-demo"
          "$RUNNER_TEMP/docs-tool/docs-boilerplate" update --output "$RUNNER_TEMP/tool-demo" --apply


  browser:
    name: Docsify browser (Chromium)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright browser (CI only)
        run: |
          python -m pip install "playwright==1.64.0"
          python -m playwright install --with-deps chromium
      - name: Verify Docsify in real Chromium
        run: python tests/docsify_browser.py
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docsify-browser-diagnostics
          path: browser-artifacts/
          if-no-files-found: ignore

  windows-generator:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build on Windows
        run: dotnet build src/DocsBoilerplate.Cli/DocsBoilerplate.Cli.csproj --configuration Release
      - name: Focused .NET contract tests on Windows
        run: dotnet run --configuration Release --project tests/DocsBoilerplate.ContractTests/DocsBoilerplate.ContractTests.csproj
      - name: Smoke-test CLI on Windows
        shell: pwsh
        run: ./tests/windows-smoke.ps1
