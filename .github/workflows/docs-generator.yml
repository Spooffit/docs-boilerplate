name: Docs generator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  generator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/DocsBoilerplate.Cli/DocsBoilerplate.Cli.csproj --configuration Release
      - name: Focused .NET contract tests
        run: dotnet run --configuration Release --project tests/DocsBoilerplate.ContractTests/DocsBoilerplate.ContractTests.csproj
      - name: Check smoke script syntax
        run: bash -n tests/smoke.sh
      - name: Smoke-test generation and Docsify shell
        run: bash tests/smoke.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check generated-content source hygiene
        run: python tests/catalog_hygiene.py
      - name: Check template repository scope and references
        run: python tests/repository_hygiene.py
      - name: Validate optional HTTP, naming and EventBus documentation examples
        run: python tests/optional_profile_contracts.py
      - name: Compile EventBus composition and verify topic routing with disposable RabbitMQ
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name docs-eventbus-ci \
            -e RABBITMQ_DEFAULT_USER=ci -e RABBITMQ_DEFAULT_PASS=ci-pass \
            -p 5673:5672 rabbitmq:4.1-alpine
          trap 'docker logs docs-eventbus-ci || true; docker rm -f docs-eventbus-ci || true' EXIT
          ready=false
          for attempt in $(seq 1 45); do
            if docker exec docs-eventbus-ci rabbitmq-diagnostics -q ping >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "Disposable RabbitMQ did not become ready" >&2
            exit 1
          fi
          python tests/optional_profile_contracts.py --run-eventbus

  browser:
    name: Docsify browser (Chromium)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright browser (CI only)
        run: |
          python -m pip install "playwright==1.64.0"
          python -m playwright install --with-deps chromium
      - name: Verify Docsify in real Chromium
        run: python tests/docsify_browser.py
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docsify-browser-diagnostics
          path: browser-artifacts/
          if-no-files-found: ignore

  windows-generator:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build on Windows
        run: dotnet build src/DocsBoilerplate.Cli/DocsBoilerplate.Cli.csproj --configuration Release
      - name: Focused .NET contract tests on Windows
        run: dotnet run --configuration Release --project tests/DocsBoilerplate.ContractTests/DocsBoilerplate.ContractTests.csproj
      - name: Smoke-test CLI on Windows
        shell: pwsh
        run: ./tests/windows-smoke.ps1
