name: Bootstrap v1.0.1 release tag

# One-time workflow: the connected GitHub integration cannot write tags directly.
# Only the exact designated commit can create and dispatch the release.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  create-tag:
    name: Tag v1.0.1 and dispatch its release
    if: "${{ github.event.head_commit.message == 'chore(release): bootstrap v1.0.1' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Ensure v1.0.1 does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/v1.0.1" > /dev/null 2>&1; then
            echo "::error::Tag v1.0.1 already exists; refusing to overwrite"
            exit 1
          fi
      - name: Create tag on this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f ref='refs/tags/v1.0.1' -f sha="$GITHUB_SHA"
      - name: Launch guarded release workflow on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GH_REPO" --ref v1.0.1
          echo "Requested release v1.0.1 on $GITHUB_SHA"
