name: One-time v1.1.0 release kickoff

# Created as manual-only first, activated on a separate push after the file
# already exists in main. This bootstrap creates the release tag and dispatches
# the existing guarded release workflow; it does not publish packages itself.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v1.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: one-time-release-v1.1.0
  cancel-in-progress: false

jobs:
  kickoff:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create immutable release tag and dispatch existing release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v1.1.0
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing duplicate publication"
            exit 0
          fi
          current=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)
          if [[ -n "$current" ]]; then
            echo "::error::Tag $tag already exists; refusing to move it or dispatch a duplicate release"
            exit 1
          fi
          gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          echo "Created $tag at $GITHUB_SHA"
          gh workflow run release.yml --ref "$tag"
          echo "Dispatched standard release workflow for $tag"
