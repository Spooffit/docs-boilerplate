<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Markdown-first project documentation">
  <link rel="describedby" href="llms.txt" type="text/plain">
  <title>Documentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
</head>
<body>
  <div id="app">Loading documentation...</div>
  <script>
    window.$docsify = {
      name: {{PROJECT_NAME_JSON}},
      homepage: "index.md",
      basePath: "docs/",
      relativePath: true,
      routerMode: "hash",
      loadSidebar: false,
      maxLevel: 3,
      auto2top: true,
      search: { paths: "auto", placeholder: "Search documentation" }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/plugins/front-matter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
</body>
</html>
